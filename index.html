<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naxxramas Resource Hub</title>
<style>html,body{margin:0;min-height:100%;background:#0c0a08;color:#cfbea4;font-family:Arial,sans-serif}.naxx-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}.naxx-loading a{color:#e7c17b}</style>
</head>
<body>
<div class="naxx-loading">Loading the Naxxramas Resource Hub…</div>
<script>
(function () {
  var siteRoot = new URL("./", location.href);
  var source = new URL("site-content.html", siteRoot);
  fetch(source, { cache: "default" })
    .then(function (response) {
      if (!response.ok) throw new Error("Could not load the Resource Hub (" + response.status + ").");
      return response.text();
    })
    .then(function (html) {
      if (!/<\/head>/i.test(html) || !/<\/body>/i.test(html)) {
        throw new Error("The original website could not be read.");
      }

      // The original 31MB Resource Hub content remains unchanged. Give its
      // root element the same Frostbound theme scope as the approved trial.
      html=html.replace(/<html\b([^>]*)>/i,function(full,attributes){
        if(/\bclass\s*=\s*(["'])(.*?)\1/i.test(attributes)){
          attributes=attributes.replace(/\bclass\s*=\s*(["'])(.*?)\1/i,function(_,quote,value){
            return 'class='+quote+value+' naxx-frostbound-ui'+quote;
          });
        }else{
          attributes+=' class="naxx-frostbound-ui"';
        }
        if(!/\bdata-naxx-style\s*=/i.test(attributes))attributes+=' data-naxx-style="frostbound"';
        return '<html'+attributes+'>';
      });
      // CSS and navigation runtime live under assets; the trials can eventually
      // be archived without affecting the published website.
      var styleURL = new URL("assets/naxx-countdowns.css?v=3", siteRoot).href;
      var scriptURL = new URL("assets/naxx-countdowns.js?v=3", siteRoot).href;
      var liveScriptURL = new URL("assets/naxx-frostbound-live.js?v=2",siteRoot).href;
      var componentsScriptURL = new URL("assets/naxx-frostbound-components.js?v=1",siteRoot).href;
      var handbookScriptURL = new URL("assets/naxx-handbook-progression-fix.js?v=1",siteRoot).href;
      html = html.replace(/<\/head>/i, '<link rel="stylesheet" href="' + styleURL + '"><link rel="stylesheet" href="' + new URL("assets/naxx-theme-v2.css", siteRoot).href + '"><link rel="stylesheet" href="' + new URL("assets/naxx-theme-v3.css", siteRoot).href + '"></head>');
      html=html.replace(/<\/head>/i,'<link rel="stylesheet" href="/Naxxramas-Resource-Hub/assets/naxx-frostbound.css?v=2"><link rel="stylesheet" href="/Naxxramas-Resource-Hub/assets/naxx-frostbound-finish.css?v=2"><link rel="stylesheet" href="/Naxxramas-Resource-Hub/assets/naxx-frostbound-context.css?v=1"><link rel="stylesheet" href="/Naxxramas-Resource-Hub/assets/naxx-frostbound-components.css?v=1"><link rel="stylesheet" href="/Naxxramas-Resource-Hub/assets/naxx-notes-handbook-frostbound.css?v=1"></head>');
      var closingBody = html.toLowerCase().lastIndexOf("</body>");
      html = html.slice(0, closingBody) + '<script src="' + scriptURL + '"><\/script>'
        + '<scr'+'ipt src="' + liveScriptURL + '"></scr'+'ipt>'
        + '<scr'+'ipt src="' + componentsScriptURL + '"></scr'+'ipt>'
        + '<scr'+'ipt src="' + handbookScriptURL + '"></scr'+'ipt>' + html.slice(closingBody);
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (err) {
      document.body.innerHTML = '<div class="naxx-loading"><div>Unable to load the Resource Hub.<p><a href="site-content.html">Open the original site</a></p></div></div>';
      if (window.console) console.error(err);
    });
})();
</script>
</body>
</html>
