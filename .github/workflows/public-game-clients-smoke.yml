name: Public Game Clients — read-only deployment smoke test

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/public-game-clients-smoke.yml'
      - 'assets/tests/public-game-clients-live-smoke.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-public-game-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out smoke test only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test read-only public deployment and Game Clients browser render
        run: node assets/tests/public-game-clients-live-smoke.test.cjs
