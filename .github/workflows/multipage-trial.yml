name: Multipage trial setup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/multipage-trial.yml"

permissions:
  contents: write

jobs:
  setup:
    if: github.event.head_commit.message == 'Set up multipage trial workflow'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Change Notes and Patches routes
        shell: python
        run: |
          from pathlib import Path
          import json

          ROOT = "/Naxxramas-Resource-Hub/"
          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")

          marker = 'id="naxx-multipage-routing-v1"'

          routing_script = r"""
          <script id="naxx-multipage-routing-v1">
          (function(){
            const ROOT = "/Naxxramas-Resource-Hub/";
            const ROUTES = {
              "Change Notes":"change-notes/",
              "Patches":"patches/"
            };

            function cleanPath(path){
              let value = String(path || "/").replace(/\/index\.html$/i,"/");
              if(!value.endsWith("/")) value += "/";
              return value;
            }

            function rootPath(){
              return cleanPath(location.pathname) === cleanPath(ROOT);
            }

            function routeUrl(section){
              if(ROUTES[section]) return ROOT + ROUTES[section];
              if(section === "Home") return ROOT;
              return ROOT + "?section=" + encodeURIComponent(section);
            }

            function shouldLeaveCurrentPage(section){
              const current = cleanPath(location.pathname);
              if(ROUTES[section]){
                return current !== cleanPath(ROOT + ROUTES[section]);
              }
              return !rootPath();
            }

            const originalShowSection = window.showSection;

            window.showSection = function(section){
              if(shouldLeaveCurrentPage(section)){
                location.assign(routeUrl(section));
                return;
              }

              return typeof originalShowSection === "function"
                ? originalShowSection(section)
                : undefined;
            };

            document.addEventListener("click",function(event){
              const button = event.target.closest(
                "#mainNav button[data-section], #mobileNav button[data-section], .wh-pro-dropdown-item, .wh-pro-home, .wh-pro-navbutton"
              );
              if(!button) return;

              let section = button.dataset?.section || "";

              if(!section){
                const inline = button.getAttribute("onclick") || "";
                const match = inline.match(/showSection\(['"]([^'"]+)['"]\)/);
                if(match) section = match[1];
              }

              if(!section || !shouldLeaveCurrentPage(section)) return;

              event.preventDefault();
              event.stopImmediatePropagation();
              location.assign(routeUrl(section));
            },true);

            if(rootPath()){
              const requested = new URLSearchParams(location.search).get("section");

              if(requested){
                setTimeout(function(){
                  if(ROUTES[requested]){
                    location.replace(routeUrl(requested));
                    return;
                  }

                  if(typeof window.showSection === "function"){
                    window.showSection(requested);
                  }

                  history.replaceState(null,"",ROOT + location.hash);
                },0);
              }
            }
          })();
          </script>
          """

          if marker not in html:
              closing = "</body></html>"
              if closing not in html:
                  raise RuntimeError("Could not find closing body/html tags in index.html")
              html = html.rsplit(closing, 1)[0] + routing_script + "\n" + closing
              index_path.write_text(html, encoding="utf-8")

          def loader_page(section):
              section_json = json.dumps(section)
              title_json = json.dumps(section + " · Naxxramas Resource Hub")
              return f'''<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>{section} · Naxxramas Resource Hub</title>
          <style>
          html,body{{margin:0;min-height:100%;background:#090806;color:#c8c0b5;font-family:Arial,sans-serif}}
          .naxx-route-loading{{min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.05em}}
          </style>
          </head>
          <body>
          <div class="naxx-route-loading">Loading Naxxramas Resource Hub…</div>
          <script>
          (function(){{
            const ROOT = "/Naxxramas-Resource-Hub/";
            const SECTION = {section_json};

            fetch(ROOT + "index.html",{{cache:"no-cache"}})
              .then(function(response){{
                if(!response.ok) throw new Error("Unable to load the Resource Hub.");
                return response.text();
              }})
              .then(function(html){{
                if(!/<base\\b/i.test(html)){{
                  html = html.replace(/<head([^>]*)>/i,'<head$1><base href="' + ROOT + '">');
                }}

                const boot =
                  '<script id="naxx-route-page-bootstrap">' +
                  'setTimeout(function(){{' +
                  'if(typeof window.showSection==="function"){{window.showSection(' + JSON.stringify(SECTION) + ');}}' +
                  'document.title=' + {title_json} + ';' +
                  '}},0);' +
                  '<\\/script>';

                html = html.replace(/<\\/body>\\s*<\\/html>\\s*$/i,boot + '</body></html>');

                document.open();
                document.write(html);
                document.close();
              }})
              .catch(function(){{
                document.body.innerHTML =
                  '<div class="naxx-route-loading"><div>Unable to load this page. <a style="color:#d7b36a" href="' +
                  ROOT + '">Return to the Resource Hub</a>.</div></div>';
              }});
          }})();
          <\/script>
          </body>
          </html>'''

          Path("change-notes").mkdir(exist_ok=True)
          Path("patches").mkdir(exist_ok=True)
          Path("change-notes/index.html").write_text(loader_page("Change Notes"), encoding="utf-8")
          Path("patches/index.html").write_text(loader_page("Patches"), encoding="utf-8")

      - name: Commit multipage trial
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html change-notes/index.html patches/index.html
          git commit -m "Add separate Change Notes and Patches pages"
          git push
