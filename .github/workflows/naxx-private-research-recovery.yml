name: Private research — pinned Git history and saved-backup inspection

on:
  pull_request:
    branches:
      - 'feature/multi-file-editor-export-2026-11-05'
    paths:
      - 'editor/tools/inspect-saved-git-bundle.cjs'
      - 'editor/tests/inspect-saved-git-bundle.test.cjs'
      - 'editor/tools/verify-pinned-local-revision-chain.cjs'
      - 'editor/tests/pinned-local-revision-chain.test.cjs'
      - 'editor/tools/inspect-remote-commit-tree.cjs'
      - 'editor/tests/inspect-remote-commit-tree.test.cjs'
      - '.github/workflows/naxx-private-research-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-existing-saved-bundle:
    name: Recheck a private backup in a disposable synthetic Git repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete test source without stored credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source syntax, without executing website JavaScript
        run: |
          node --check editor/tools/inspect-saved-git-bundle.cjs
          node --check editor/tests/inspect-saved-git-bundle.test.cjs
      - name: Run exact saved-bundle recovery and refusal tests
        run: node --test editor/tests/inspect-saved-git-bundle.test.cjs
      - name: Confirm original tracked checkout remains untouched
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  verify-original-backed-version-chain:
    name: Rebuild 414 real source records through two disposable Git revisions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout all source history without stored credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm immutable 30,976,969-byte original website source
        run: |
          test "$(wc -c < site-content.html)" -eq 30976969
          printf '%s  %s\n' '34455f6d901c538e2491a8c16681692e4c02d918b1984d7d0ba081aacb1049e8' 'site-content.html' | sha256sum -c -
      - name: Verify syntax and protected source chain in a disposable Git repository
        run: |
          node --check editor/tools/verify-pinned-local-revision-chain.cjs
          node --check editor/tests/pinned-local-revision-chain.test.cjs
          node --test editor/tests/pinned-local-revision-chain.test.cjs
      - name: Confirm original tracked checkout and site remain untouched
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s  %s\n' '34455f6d901c538e2491a8c16681692e4c02d918b1984d7d0ba081aacb1049e8' 'site-content.html' | sha256sum -c -

  verify-authenticated-remote-tree:
    name: Read GitHub PR head/tree and match exact pinned checkout (never Save)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 57 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR HEAD without stored credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pure failure handling and local Git object integrity
        run: |
          node --check editor/tools/inspect-remote-commit-tree.cjs
          node --check editor/tests/inspect-remote-commit-tree.test.cjs
          node --test editor/tests/inspect-remote-commit-tree.test.cjs
      - name: Authenticate read-only GitHub reference, Git commit tree and local source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node editor/tools/inspect-remote-commit-tree.cjs --ci-research-remote
      - name: Verify original tracked checkout was not modified or exposed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s  %s\n' '34455f6d901c538e2491a8c16681692e4c02d918b1984d7d0ba081aacb1049e8' 'site-content.html' | sha256sum -c -

# Research CI makes three fixed HTTPS GETs to GitHub's official API with
# contents:read. No repository write token, webhook, artifact upload, release,
# push, merge, deployment or retained private bundle.

